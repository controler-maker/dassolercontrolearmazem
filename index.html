    // --- CÁLCULOS MATEMÁTICOS COM PRECISÃO ---
    function calcDiscounts(grainKey, netWeight, moisture = 0, impurity = 0, damaged = 0, manualOverride = null) {
      if (!grainKey || !GRAINS_DATA[grainKey] || !netWeight || netWeight <= 0) {
        return { totalDiscount: 0, classifiedNet: netWeight, details: [] };
      }
      if (manualOverride && Number.isFinite(manualOverride)) {
        return { totalDiscount: manualOverride, classifiedNet: Math.max(0, netWeight - manualOverride), details: [] };
      }

      const tol = GRAINS_DATA[grainKey].tolerances;
      let remaining = netWeight;
      let dImp = 0, dUmid = 0, dDam = 0;

      // 1) Impureza
      if (impurity > tol.impureza) {
        const excess = impurity - tol.impureza;
        const div = 100 - tol.impureza;
        dImp = remaining * (excess / div);
        remaining = Math.max(0, remaining - dImp);
      }
      // 2) Umidade
      if (moisture > tol.umidade) {
        const excess = moisture - tol.umidade;
        const div = 100 - tol.umidade;
        dUmid = remaining * (excess / div);
        remaining = Math.max(0, remaining - dUmid);
      }
      // 3) Avariados
      if (damaged > tol.avariados) {
        const excess = damaged - tol.avariados;
        dDam = remaining * (excess / 100);
        remaining = Math.max(0, remaining - dDam);
      }

      const total = Math.round((dImp + dUmid + dDam) * 100) / 100;
      return {
        totalDiscount: total,
        classifiedNet: Math.round(remaining * 100) / 100,
        impurityKg: Math.round(dImp * 100) / 100,
        moistureKg: Math.round(dUmid * 100) / 100,
        damagedKg: Math.round(dDam * 100) / 100
      };
    }

    function calcAutoPackaging(netWeight, unit, capKg) {
      if (!unit || !netWeight || netWeight <= 0 || !capKg || capKg <= 0) return 0;
      return Math.ceil(netWeight / capKg);
    }

    function generateRomaneio(prefix, list) {
      const nextNum = list.length + 1;
      return `${prefix}-${String(nextNum).padStart(6, '0')}`;
    }

    function fmtKg(n) {
      return (Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' kg';
    }
    function fmtTons(n) {
      return ((Number(n) || 0) / 1000).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' t';
    }
    function fmtLiters(n) {
      return (Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' L';
    }

    function handleLogin(e) {

        DB.set('auth', true);
        render();
      } else {
        const err = document.getElementById('login-err');
        err.classList.remove('hidden');
        err.innerText = 'Usuário ou senha inválidos. Utilize DASSOLER e Dassoler@123.';
      }
    }

    function handleLogout() {
      state.authenticated = false;
      DB.set('auth', false);
      render();
    }

    // --- CONTROLE DE SALDO DIESEL ---
    function getDieselStocks() {
      let s500 = 0, s10 = 0;
      state.diesel.forEach(d => {
        const q = Number(d.quantity) || 0;
        const isRec = d.movementType === 'recebimento';
        if (d.fuelType === 's500') s500 += isRec ? q : -q;
        else s10 += isRec ? q : -q;
      });
      return {
        s500: Math.max(0, Math.round(s500 * 100) / 100),
        s10: Math.max(0, Math.round(s10 * 100) / 100),
        s500Low: state.dieselConfig.s500Cap > 0 && s500 <= (state.dieselConfig.s500Cap * 0.15),
        s10Low: state.dieselConfig.s10Cap > 0 && s10 <= (state.dieselConfig.s10Cap * 0.15)
      };
    }

    // --- CONTROLE DE ESTOQUE DE EMBALAGENS ---
    function getPackagingStocks() {
      let bags = 0, sacas = 0;
      state.packaging.forEach(p => {
        const q = Number(p.quantity) || 0;
        const isEnt = p.movementType === 'entrada';
        if (p.unit === 'bag') bags += isEnt ? q : -q;
        else sacas += isEnt ? q : -q;
      });
      return { bags, sacas };
    }

    // --- BACKUP & RESTORE JSON ---
    function exportBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `backup_dassoler_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function importBackup(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const imported = JSON.parse(evt.target.result);
          if (imported.receipts) state.receipts = imported.receipts;
          if (imported.loads) state.loads = imported.loads;
          if (imported.oneoffs) state.oneoffs = imported.oneoffs;
          if (imported.diesel) state.diesel = imported.diesel;
          if (imported.dieselConfig) state.dieselConfig = imported.dieselConfig;
          if (imported.packaging) state.packaging = imported.packaging;
          if (imported.meals) state.meals = imported.meals;
          if (imported.producers) state.producers = imported.producers;
          saveState();
          alert('Backup restaurado com sucesso!');
          render();
        } catch(err) {
          alert('Erro ao carregar arquivo de backup.');
        }
      };
      reader.readAsText(file);
    }

    function downloadThisHtml() {
      const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    // 1. Visão Geral
    function renderOverviewTab() {

    function renderCharts() {
      const f = state.reportFilter;
      const filtered = state.receipts.filter(r => {
        if (f.producer && r.producer !== f.producer) return false;
        if (f.grain && r.grain !== f.grain) return false;
        if (f.unit && r.unit !== f.unit) return false;
        return true;
      });

      const grainMap = {};
      filtered.forEach(r => {
        const g = r.grain || 'Livre';
        grainMap[g] = (grainMap[g] || 0) + ((r.classifiedNet || r.netWeight || 0) / 1000);
      });

      const ctxG = document.getElementById('chart-grains');
      if (ctxG) {
        new Chart(ctxG, {
          type: 'bar',
          data: {
            labels: Object.keys(grainMap),
            datasets: [{
              label: 'Volume (t)',
              data: Object.values(grainMap),
              backgroundColor: '#0f4a32',
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } }
          }
        });
      }

      const totL = filtered.reduce((s, r) => s + (r.classifiedNet || r.netWeight || 0), 0) / 1000;
      const totD = filtered.reduce((s, r) => s + (r.totalDiscount || 0), 0) / 1000;

      const ctxB = document.getElementById('chart-breakdown');
      if (ctxB) {
        new Chart(ctxB, {
          type: 'doughnut',
          data: {
            labels: ['Líquido Comercial (t)', 'Descontos / Quebra (t)'],
            datasets: [{
              data: [totL, totD],
              backgroundColor: ['#0f4a32', '#c4a35a'],
              borderWidth: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '70%'
          }
        });
      }
    }

    // --- MODAIS ---
    function openModal(type, item = null) {
      state.currentModal = type;
      state.editingItem = item;
      const c = document.getElementById('modal-container');
      c.innerHTML = `
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
          <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl border border-slate-100 overflow-hidden my-8 max-h-[90vh] flex flex-col">

              <h3 class="font-bold text-slate-800 text-sm">${item ? 'Editar' : 'Novo'} ${getModalTitle(type)}</h3>
              <button onclick="closeModal()" class="w-8 h-8 rounded-full hover:bg-slate-200 text-slate-500 font-bold flex items-center justify-center">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto custom-scroll flex-1">
              ${renderModalForm(type, item)}
            </div>
          </div>
        </div>
      `;
    }

    function closeModal() {
      state.currentModal = null;
      state.editingItem = null;
      document.getElementById('modal-container').innerHTML = '';
    }

    function getModalTitle(t) {
      switch(t) {
        case 'receipt': return 'Recebimento de Produtor';
        case 'load': return 'Carregamento de Exportação';
        case 'oneoff': return 'Pesagem Avulsa';
        case 'packaging': return 'Movimentação de Embalagens';
        case 'diesel': return 'Lançamento de Diesel';
        case 'meal': return 'Pedido de Marmita';
      }
    }

    // --- CÁLCULOS DINÂMICOS NOS FORMULÁRIOS ---
    function updateVarietiesSelect(grainKey) {
      const dl = document.getElementById('dl-vars');
      if (!dl) return;
      if (!grainKey || !GRAINS_DATA[grainKey]) {
        dl.innerHTML = '';
        return;
      }
      dl.innerHTML = GRAINS_DATA[grainKey].varieties.map(v => `<option value="${v}">`).join('');
    }

    function toggleManualDiscount(checked) {
      const el = document.getElementById('m-manual-disc');
      if (!el) return;
      el.classList.toggle('hidden', !checked);
      calcReceiptModal();
    }

    function calcReceiptModal() {
      const b = Number(document.getElementById('m-bruto')?.value) || 0;
      const t = Number(document.getElementById('m-tara')?.value) || 0;
      const net = Math.max(0, b - t);
      const netoEl = document.getElementById('m-neto');
      if (netoEl) netoEl.value = net.toLocaleString('pt-BR', { minimumFractionDigits: 2 });

      const g = document.getElementById('m-grain')?.value;
      const u = Number(document.getElementById('m-umid')?.value) || 0;
      const i = Number(document.getElementById('m-imp')?.value) || 0;
      const d = Number(document.getElementById('m-dam')?.value) || 0;

      const isManual = document.getElementById('m-override')?.checked;
      const manualVal = isManual ? Number(document.getElementById('m-manual-disc')?.value) : null;

      const res = calcDiscounts(g, net, u, i, d, manualVal);
      const disp = document.getElementById('m-liq-display');
      if (disp) disp.innerText = fmtKg(res.classifiedNet);
    }

    function calcLoadModal() {
      const b = Number(document.getElementById('l-bruto')?.value) || 0;
      const t = Number(document.getElementById('l-tara')?.value) || 0;
      const net = Math.max(0, b - t);
      const netoEl = document.getElementById('l-neto');
      if (netoEl) netoEl.value = net.toLocaleString('pt-BR', { minimumFractionDigits: 2 });

      const u = document.getElementById('l-unit')?.value;
      const c = Number(document.getElementById('l-cap')?.value) || 0;
      const qty = calcAutoPackaging(net, u, c);
      const disp = document.getElementById('l-pack-qty-display');
      if (disp) disp.innerText = `${qty} unidades`;
    }

    function updateLoadPackSizes(unit) {
      const sel = document.getElementById('l-cap');
      if (!sel) return;
      if (unit === 'saca') {
        sel.innerHTML = SACA_SIZES.map(s => `<option value="${s}" ${s === 60 ? 'selected' : ''}>${s} kg</option>`).join('');
      } else if (unit === 'bag') {
        sel.innerHTML = BAG_SIZES.map(b => `<option value="${b}" ${b === 1000 ? 'selected' : ''}>${b} kg</option>`).join('');
      } else {
        sel.innerHTML = `<option value="0">0 kg</option>`;
      }
      calcLoadModal();
    }

    function calcOneoffModal() {
      const b = Number(document.getElementById('o-bruto')?.value) || 0;
      const t = Number(document.getElementById('o-tara')?.value) || 0;
      const net = Math.max(0, b - t);
      const netoEl = document.getElementById('o-neto');
      if (netoEl) netoEl.value = net.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
    }

    function updatePackModalSizes(unit) {
      const sel = document.getElementById('p-cap');
      if (!sel) return;
      if (unit === 'saca') {
        sel.innerHTML = SACA_SIZES.map(s => `<option value="${s}" ${s === 60 ? 'selected' : ''}>${s} kg</option>`).join('');
      } else {
        sel.innerHTML = BAG_SIZES.map(b => `<option value="${b}" ${b === 1000 ? 'selected' : ''}>${b} kg</option>`).join('');
      }
    }

    // --- HANDLERS DE SALVAR NO BANCO LOCAL ---
    function handleSaveReceipt(e, editId) {
      e.preventDefault();
      const b = Number(document.getElementById('m-bruto').value) || 0;
      const t = Number(document.getElementById('m-tara').value) || 0;
      const net = Math.max(0, b - t);
      const g = document.getElementById('m-grain').value;
      const u = Number(document.getElementById('m-umid').value) || 0;
      const i = Number(document.getElementById('m-imp').value) || 0;
      const d = Number(document.getElementById('m-dam').value) || 0;
      const isManual = document.getElementById('m-override').checked;
      const manVal = isManual ? (Number(document.getElementById('m-manual-disc').value) || 0) : null;
      const res = calcDiscounts(g, net, u, i, d, manVal);

      const prodName = document.getElementById('m-prod').value.trim();
      if (prodName && !state.producers.includes(prodName)) {
        state.producers.push(prodName);
      }

      const item = {
        id: editId || Date.now(),
        romaneio: editId ? state.editingItem.romaneio : generateRomaneio('REC', state.receipts),
        unit: document.getElementById('m-unit').value,
        date: document.getElementById('m-date').value,
        producer: prodName,
        farm: document.getElementById('m-farm').value.trim(),
        plate: document.getElementById('m-plate').value.trim().toUpperCase(),
        grain: g,
        variety: document.getElementById('m-var').value.trim(),
        grossWeight: b,
        tareWeight: t,
        netWeight: net,
        moisture: u,
        impurity: i,
        damaged: d,
        totalDiscount: res.totalDiscount,
        classifiedNet: res.classifiedNet
      };

      if (editId) {
        state.receipts = state.receipts.map(x => x.id === editId ? item : x);
      } else {
        state.receipts.push(item);
      }

      saveState();
      closeModal();
      render();
    }

    function handleSaveLoad(e, editId) {
      e.preventDefault();
      const b = Number(document.getElementById('l-bruto').value) || 0;
      const t = Number(document.getElementById('l-tara').value) || 0;
      const net = Math.max(0, b - t);
      const u = document.getElementById('l-unit').value;
      const c = Number(document.getElementById('l-cap').value) || 0;
      const q = calcAutoPackaging(net, u, c);

      const item = {
        id: editId || Date.now(),
        romaneio: editId ? state.editingItem.romaneio : generateRomaneio('EXP', state.loads),
        contract: document.getElementById('l-contract').value.trim(),
        plate: document.getElementById('l-plate').value.trim().toUpperCase(),
        date: document.getElementById('l-date').value,
        grain: document.getElementById('l-grain').value,
        grossWeight: b,
        tareWeight: t,
        netWeight: net,
        packUnit: u,
        packCap: c,
        packQty: q
      };

      if (editId) {
        state.loads = state.loads.map(x => x.id === editId ? item : x);
      } else {
        state.loads.push(item);
        if (u && q > 0) {
          state.packaging.push({
            id: Date.now() + 1,
            movementType: 'saida',
            date: item.date,
            unit: u,
            capacityKg: c,
            quantity: q,
            reference: `Baixa automática Romaneio ${item.romaneio}`
          });
        }
      }

      saveState();
      closeModal();
      render();
    }

      const b = Number(document.getElementById('o-bruto').value) || 0;

    function handleSavePackaging(e) {
      e.preventDefault();
      const item = {
        id: Date.now(),
        movementType: document.getElementById('p-type').value,
        date: document.getElementById('p-date').value,
        unit: document.getElementById('p-unit').value,
        capacityKg: Number(document.getElementById('p-cap').value) || 0,

        reference: document.getElementById('p-ref').value.trim()
      };
      state.packaging.push(item);
      saveState();
      closeModal();
      render();
    }

    function handleSaveDiesel(e) {
      e.preventDefault();
      const item = {
        id: Date.now(),
        movementType: document.getElementById('d-type').value,
        fuelType: document.getElementById('d-fuel').value,
        quantity: Number(document.getElementById('d-qty').value) || 0,
        date: document.getElementById('d-date').value,
        description: document.getElementById('d-desc').value.trim(),
        signedBy: document.getElementById('d-signed').value.trim()
      };
      state.diesel.push(item);
      saveState();
      closeModal();
      render();
    }

    function handleSaveMeal(e) {
      e.preventDefault();
      const item = {
        id: Date.now(),
        unit: document.getElementById('me-unit').value,
        size: document.getElementById('me-size').value,
        quantity: Number(document.getElementById('me-qty').value) || 0,
        date: document.getElementById('me-date').value,
        requester: document.getElementById('me-req').value.trim(),
        notes: document.getElementById('me-notes').value.trim()
      };
      state.meals.push(item);
      saveState();
      closeModal();
      render();
    }

    // --- EDIÇÃO E EXCLUSÃO RÁPIDA ---
    function editItem(type, id) {
      let list = [];
      if (type === 'receipt') list = state.receipts;
      else if (type === 'load') list = state.loads;
      else if (type === 'oneoff') list = state.oneoffs;
      const item = list.find(x => x.id === id);
      if (item) openModal(type, item);
    }

    function deleteItem(type, id) {
      if (!confirm('Deseja realmente excluir este registro? Os saldos e relatórios serão recalculados.')) return;
      if (type === 'receipt') state.receipts = state.receipts.filter(x => x.id !== id);
      else if (type === 'load') state.loads = state.loads.filter(x => x.id !== id);
      else if (type === 'oneoff') state.oneoffs = state.oneoffs.filter(x => x.id !== id);
      else if (type === 'packaging') state.packaging = state.packaging.filter(x => x.id !== id);
      else if (type === 'diesel') state.diesel = state.diesel.filter(x => x.id !== id);
      else if (type === 'meal') state.meals = state.meals.filter(x => x.id !== id);
      saveState();
      render();
    }

    // --- IMPRESSÃO COM MARCA D'ÁGUA DA LOGO DASSOLER ---
    function printTicket(type, id) {
      let item = null;
      let title = '';
      if (type === 'recebimento') { item = state.receipts.find(x => x.id === id); title = 'Romaneio de Recebimento'; }
      else if (type === 'carregamento') { item = state.loads.find(x => x.id === id); title = 'Comprovante de Carregamento'; }
      else if (type === 'avulsa') { item = state.oneoffs.find(x => x.id === id); title = 'Comprovante de Pesagem Avulsa'; }
      if (!item) return;

      const pArea = document.getElementById('print-area');
      pArea.innerHTML = `
        <div class="p-8 max-w-2xl mx-auto border-2 border-slate-300 relative bg-white">
          <div class="absolute inset-0 flex items-center justify-center opacity-5 pointer-events-none">
            ${LOGO_SVG}
          </div>
          <div class="flex items-center justify-between border-b-2 border-forest pb-4 mb-4">
            <div>${LOGO_SVG}</div>
            <div class="text-right">
              <h2 class="text-lg font-bold text-forest uppercase">${title}</h2>
              <div class="text-xs font-mono font-bold">${item.romaneio}</div>
              <div class="text-[11px] text-slate-500">${item.date}</div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4 text-xs mb-4">
            <div><strong>Placa:</strong> ${item.plate}</div>
            <div><strong>Unidade:</strong> ${(item.unit || 'Matriz').toUpperCase()}</div>
            ${item.producer ? `<div><strong>Produtor:</strong> ${item.producer}</div>` : ''}
            ${item.farm ? `<div><strong>Fazenda:</strong> ${item.farm}</div>` : ''}
            ${item.contract ? `<div><strong>Contrato:</strong> ${item.contract}</div>` : ''}
            ${item.grain ? `<div><strong>Grão / Variedade:</strong> ${item.grain} ${item.variety || ''}</div>` : ''}
          </div>

          <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6 text-xs">
            <div class="grid grid-cols-3 gap-2 font-bold text-center">
              <div>Peso Bruto: ${fmtKg(item.grossWeight)}</div>
              <div>Tara: ${fmtKg(item.tareWeight)}</div>
              <div class="text-forest">Líquido: ${fmtKg(item.classifiedNet || item.netWeight)}</div>
            </div>
            ${item.totalDiscount ? `<div class="text-center text-amber-800 text-[11px] mt-2 border-t pt-2">Descontos aplicados (Classificação MT): ${fmtKg(item.totalDiscount)}</div>` : ''}
          </div>

          <div class="grid grid-cols-2 gap-8 pt-12 border-t border-slate-200 text-center text-xs">
            <div>____________________________<br>Assinatura Responsável</div>
            <div>____________________________<br>Motorista / Conferente</div>
          </div>
        </div>
      `;
      window.print();
    }

    function printProducerReport() {
      const f = state.reportFilter;
      const filtered = state.receipts.filter(r => {
        if (f.producer && r.producer !== f.producer) return false;
        if (f.grain && r.grain !== f.grain) return false;
        if (f.unit && r.unit !== f.unit) return false;
        return true;
      });

      const pArea = document.getElementById('print-area');
      pArea.innerHTML = `
        <div class="p-8 max-w-4xl mx-auto border-2 border-slate-300 relative bg-white">
          <div class="absolute inset-0 flex items-center justify-center opacity-5 pointer-events-none">
            ${LOGO_SVG}
          </div>
          <div class="flex items-center justify-between border-b-2 border-forest pb-4 mb-6">
            <div>${LOGO_SVG}</div>
            <div class="text-right">
              <h2 class="text-lg font-bold text-forest uppercase">Relatório de Originação de Grãos</h2>
              <div class="text-xs font-bold">${f.producer || 'Todos os Produtores'} &bull; ${f.unit ? f.unit.toUpperCase() : 'Geral'}</div>
              <div class="text-[11px] text-slate-500">Emissão: ${new Date().toLocaleDateString('pt-BR')}</div>
            </div>
          </div>

          <table class="w-full text-left text-xs mb-8">
            <thead>
              <tr class="border-b text-slate-500 uppercase text-[10px]">
                <th class="py-2">Data</th>
                <th>Romaneio</th>
                <th>Produtor / Fazenda</th>
                <th>Grão / Variedade</th>
                <th class="text-right">Líquido Comercial</th>
              </tr>
            </thead>
            <tbody class="divide-y">
              ${filtered.map(r => `
                <tr>
                  <td class="py-2">${r.date}</td>
                  <td class="font-bold text-forest">${r.romaneio}</td>
                  <td>${r.producer} (${r.farm || '—'})</td>
                  <td>${r.grain} ${r.variety || ''}</td>
                  <td class="text-right font-bold">${fmtKg(r.classifiedNet || r.netWeight)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <div class="text-right border-t-2 border-forest pt-3 text-sm font-bold text-forest">
            Total Líquido Comercial: ${fmtTons(filtered.reduce((s, r) => s + (r.classifiedNet || r.netWeight || 0), 0))}
          </div>
        </div>
      `;
      window.print();
    }

    // Inicialização da aplicação
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
